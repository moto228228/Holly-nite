<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Фонарщик глубин</title>
<style>
html{color-scheme:dark}
body{margin:0;height:100dvh!important}
/* layout: игра на весь экран; сенсорные кнопки снизу (портрет) или поверх (альбом); меню поверх всего */
:root{--bg:#0d1417;--panel:#17242a;--line:#35505a;--fg:#dce8e4;--mute:#8aa3a0;--glow:#ffc45c;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;gap:6px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden;position:relative}
#wrap{flex:1;min-height:0;position:relative}
canvas{display:block}
#c{position:absolute;inset:0;width:100%;height:100%}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;touch-action:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--glow)}
button:disabled{opacity:.45;cursor:default}
#menuBtn{position:absolute;top:6px;right:6px;padding:8px 14px;font-size:14px;z-index:2;touch-action:manipulation}
#pad{--s:1;position:relative;height:calc(186px*var(--s));flex:none;touch-action:none}
#pad button{position:absolute;border-radius:50%;font-size:13px;padding:0;background:rgba(23,36,42,.78)}
#pad button.on{background:#4a6d79}
#move{position:absolute;left:0;bottom:calc(4px*var(--s));width:calc(150px*var(--s));height:calc(150px*var(--s));display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:2px}
#move span{display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:rgba(23,36,42,.78);font-size:22px}
#move span.on{background:#4a6d79}
#knob{display:none}
#move.stick{display:block;border:2px solid var(--line);border-radius:50%;background:rgba(23,36,42,.55)}
#move.stick span{display:none}
#move.stick #knob{display:block;position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;background:#4a6d79;border:2px solid var(--fg);transform:translate(calc(-50% + var(--x,0px)),calc(-50% + var(--y,0px)));box-sizing:border-box}
#mu{grid-area:1/2}#ml{grid-area:2/1}#mr{grid-area:2/3}#md{grid-area:3/2}
[data-k=jump]{right:0;bottom:0;width:calc(86px*var(--s));height:calc(86px*var(--s))}
[data-k=hit]{right:calc(92px*var(--s));bottom:0;width:calc(76px*var(--s));height:calc(76px*var(--s))}
[data-k=dash]{right:calc(4px*var(--s));bottom:calc(94px*var(--s));width:calc(68px*var(--s));height:calc(68px*var(--s))}
[data-k=rage]{right:calc(78px*var(--s));bottom:calc(86px*var(--s));width:calc(66px*var(--s));height:calc(66px*var(--s))}
[data-k=heal]{right:calc(150px*var(--s));bottom:calc(102px*var(--s));width:calc(58px*var(--s));height:calc(58px*var(--s))}
[data-k=bolt]{right:calc(8px*var(--s));bottom:calc(168px*var(--s));width:calc(58px*var(--s));height:calc(58px*var(--s))}
[data-k=slam]{right:calc(78px*var(--s));bottom:calc(160px*var(--s));width:calc(58px*var(--s));height:calc(58px*var(--s))}
#pad.tall{height:calc(230px*var(--s))}
#pad button.ready{border-color:#ff5238;box-shadow:0 0 14px #ff5238}
#use{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:10px 18px;z-index:2;border-color:var(--glow);white-space:nowrap}
#pad.none{display:none}
@media (orientation:landscape){#pad{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:8px;opacity:.82;pointer-events:none}#pad>*{pointer-events:auto}}
#panel{position:absolute;inset:0;background:rgba(6,11,13,.96);z-index:5;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#panel .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#panel h2{font:600 20px Georgia,serif;color:var(--glow);margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{padding:9px 14px;touch-action:manipulation}
.row button[aria-pressed=true]{border-color:var(--glow);color:var(--glow)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.item div{min-width:0}.item small{display:block;color:var(--mute)}
.item button{padding:8px 12px;flex:none;touch-action:manipulation}
#mapbox{overflow:auto;max-height:52vh;background:#05090b;border:1px solid var(--line);border-radius:8px;-webkit-overflow-scrolling:touch}
#map{display:block}
.key{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;font-size:13px}
.key span{display:flex;gap:6px;align-items:center}
.key b{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#0d1417;font-size:12px}
.mute{color:var(--mute);font-size:13px;margin:0;line-height:1.5}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" aria-label="Игровое поле"></canvas><button id="menuBtn">Меню</button><button id="use" hidden></button></div>
<div id="pad" class="none">
 <div id="move" aria-label="Крестовина"><span id="mu">▲</span><span id="ml">◀</span><span id="mr">▶</span><span id="md">▼</span><i id="knob"></i></div>
 <button data-k="jump">Прыжок</button><button data-k="hit">Удар</button><button data-k="dash" hidden>Рывок</button><button data-k="rage" hidden>Ярость</button><button data-k="heal" hidden>Лечить</button><button data-k="slam" hidden>Обвал</button><button data-k="bolt" hidden>Магия</button>
</div>
<div id="panel" hidden></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d'),pad=$('pad'),panel=$('panel'),useBtn=$('use');
const T=32,W=178,ROWS=148,VH=12*T,BC=45,BR=37,SAVE='lamplighter-world2';
let VW=640;

/* ---------- ввод: клавиатура, касание, мышь, геймпад ---------- */
const kb={},tc={},ms={},gp={},keys={},prev={};
const keymap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',KeyZ:'jump',KeyW:'up',ArrowUp:'up',KeyJ:'hit',KeyX:'hit',KeyK:'dash',KeyC:'dash',ShiftLeft:'dash',KeyR:'rage',KeyV:'rage',KeyH:'heal',KeyF:'heal',KeyG:'slam',KeyQ:'bolt',KeyI:'bolt',KeyE:'use',ArrowDown:'down',KeyS:'down',KeyM:'menu',Tab:'menu',Escape:'menu',Enter:'start'};
addEventListener('keydown',e=>{
 const k=keymap[e.code];if(!k)return;
 if(!panel.hidden){if(e.code==='Escape'||e.code==='KeyM'){e.preventDefault();closePanel()}return}
 e.preventDefault();kb[e.code]=k;if(!e.repeat)tap[k]=true;
});
const tap={};
addEventListener('keyup',e=>{delete kb[e.code]});
function release(){for(const o of [kb,tc,ms,gp,tap])for(const k in o)delete o[k];document.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));$('move').style.removeProperty('--x');$('move').style.removeProperty('--y')}
addEventListener('blur',release);
function showPad(v){pad.classList.toggle('none',!v)}
if(matchMedia('(pointer:coarse)').matches)showPad(true);
addEventListener('touchstart',()=>showPad(true),{passive:true});
document.querySelectorAll('#pad button').forEach(b=>{
 const k=b.dataset.k,set=v=>{if(v){tc[k]=true;tap[k]=true}else delete tc[k];b.classList.toggle('on',v)};
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,()=>set(false)));
});
// крестовина: палец можно вести, не отрывая; нажато всегда только одно направление
{const m=$('move');let id=null;
 const mark=(k,el,v)=>{if(v)tc[k]=true;else delete tc[k];$(el).classList.toggle('on',v)};
 const knob=(x,y)=>{const k=Math.min(1,.62/(Math.hypot(x,y)||1)),half=m.clientWidth/2;m.style.setProperty('--x',x*k*half+'px');m.style.setProperty('--y',y*k*half+'px')};
 const apply=(x,y)=>{
  if(m.classList.contains('stick')){knob(x,y);mark('left','ml',x<-.28);mark('right','mr',x>.28);mark('up','mu',y<-.55);mark('down','md',y>.55);return}
  const dead=Math.hypot(x,y)<.15,v=Math.abs(y)*1.1>=Math.abs(x);
  mark('left','ml',!dead&&!v&&x<0);mark('right','mr',!dead&&!v&&x>0);mark('up','mu',!dead&&v&&y<0);mark('down','md',!dead&&v&&y>0)};
 const set=e=>{const r=m.getBoundingClientRect();apply((e.clientX-r.left)/r.width*2-1,(e.clientY-r.top)/r.height*2-1)};
 const end=e=>{if(e.pointerId!==id)return;id=null;apply(0,0)};
 m.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;m.setPointerCapture(id);set(e)});
 m.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(n=>m.addEventListener(n,end));}
addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
 if(state!=='play'){tap.go=true;return}
 if(e.pointerType==='mouse'){const k=e.button===2?'dash':'hit';ms[k]=true;tap[k]=true}
});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse'){delete ms.hit;delete ms.dash}});
useBtn.addEventListener('click',()=>{tap.use=true});
$('menuBtn').addEventListener('click',()=>{if(state==='play')openMenu('map');$('menuBtn').blur()});
function readInput(){
 for(const k in gp)delete gp[k];
 const pd=navigator.getGamepads&&[...navigator.getGamepads()].find(Boolean);
 if(pd){const b=i=>pd.buttons[i]&&pd.buttons[i].pressed;
  if(pd.axes[0]<-.4||b(14))gp.left=true;if(pd.axes[0]>.4||b(15))gp.right=true;
  if(b(0))gp.jump=true;if(b(2))gp.hit=true;if(b(1)||b(5))gp.dash=true;if(b(3))gp.rage=true;if(b(4))gp.heal=true;if(pd.axes[1]<-.5||b(12))gp.up=true;if(pd.axes[1]>.5||b(13))gp.down=true;if(b(6))gp.slam=true;if(b(7))gp.bolt=true;if(b(9))gp.menu=true}
 for(const k of ['left','right','up','down','jump','hit','dash','rage','heal','slam','bolt','use','menu','start','go'])
  keys[k]=!!(tc[k]||ms[k]||gp[k]||tap[k]||Object.values(kb).includes(k));
}
const pressed=k=>keys[k]&&!prev[k];
function endFrame(){Object.assign(prev,keys);for(const k in tap)delete tap[k]}

/* ---------- мир ---------- */
// 0 воздух, 1 камень, 2 шипы, 3 гладкий металл, 4 решётка арены, 5 уступ (проходится снизу)
const base=Array.from({length:ROWS},()=>Array(W).fill(1));
function fill(x0,x1,y0,y1,v){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)base[y][x]=v}
const ledge=(x,y,w=3)=>fill(x,x+w-1,y,y,5);
const pit=(x,floor,w=3)=>{fill(x,x+w-1,floor,floor,0);fill(x,x+w-1,floor+1,floor+1,2)};
fill(40,133,2,8,0);fill(2,175,14,23,0);fill(2,157,30,38,0);fill(2,175,45,53,0);
fill(83,86,3,13,0);fill(82,82,14,21,1);fill(87,87,14,21,1);
pit(101,24,7);for(const x of [38,58,120,137])pit(x,24);
for(const x of [49,66,118])pit(x,39);for(const x of [34,60,100,130,150])pit(x,54);
fill(100,101,5,8,3);
for(const f of [69,84,99])fill(2,175,f-9,f-1,0);
for(const x of [36,70,100,140])pit(x,69);for(const x of [34,70,120,150])pit(x,84);for(const x of [40,90,130])pit(x,99);
stairs(80,54,69);stairs(50,69,84);stairs(96,84,99);
for(const f of [114,129,144])fill(2,175,f-9,f-1,0);
for(const [f,xs] of [[114,[36,92,134]],[129,[36,84,134]],[144,[40,96,134]]])for(const x of xs)pit(x,f);
stairs(70,99,114);stairs(110,114,129);stairs(60,129,144);
for(const f of [114,129,144])for(const x of [31,60,104,134,162]){ledge(x,f-2);ledge(x+5,f-4)}
for(const [x0,x1,f] of [[50,58,114],[120,130,114],[44,52,129],[96,104,129],[110,118,144],[76,86,144]])fill(x0,x1,f-9,f-8,1);
fill(96,99,84,84,7);            // треснувший пол: нужен обвал
fill(112,113,60,68,6);          // треснувшая стена: нужен сильный удар
for(const f of [69,84,99])for(const x of [31,60,104,134,162]){ledge(x,f-2);ledge(x+5,f-4)}
for(const [x0,x1,f] of [[40,46,69],[120,128,69],[56,62,84],[100,108,84],[140,148,84],[60,70,99],[110,118,99]])fill(x0,x1,f-9,f-8,1);
function stairs(x,top,bottom){fill(x,x+3,top,bottom-1,0);let left=true;for(let y=bottom-2;y>top;y-=2){ledge(left?x:x+2,y,2);left=!left}}
stairs(74,24,39);stairs(40,39,54);stairs(108,39,54);
for(const [x,y] of [[33,22],[44,22],[49,20],[63,22],[129,22],[133,20],[143,22],[74,7],[93,7],[30,37],[35,35],[56,37],[94,37],[22,52],[27,50],[75,52],[116,52],[121,50],[158,52],[163,50]])ledge(x,y);
for(const [x0,x1,y0,y1] of [[30,36,14,16],[54,60,14,17],[115,118,14,17],[124,127,14,16],[30,37,30,31],[52,58,30,32],[98,104,30,31],[56,66,45,47],[84,90,45,46],[140,146,45,47]])fill(x0,x1,y0,y1,1);

const AREAS=[ // [x0,x1,y0,y1,название,фон,камень,кромка]
 [0,64,0,12,'Гнездовье ветров','#142436','#33506a','#9cc8e0'],[64,109,0,12,'Вершины','#1b2740','#43527a','#c0ccf0'],[109,178,0,12,'Колокольня','#1a1630','#3a3260','#a193e0'],
 [0,69,12,28,'Заросшие сады','#112017','#2f4a34','#8fbf6a'],[69,108,12,28,'Перекрёсток','#10232b','#2c4a52','#6fa7a0'],[108,178,12,28,'Старые шахты','#241a18','#5a3a2e','#d08a55'],
 [0,62,28,43,'Грибные гроты','#21142a','#4e2f5c','#d58ad0'],[62,98,28,43,'Приют торговца','#25200f','#5a4c28','#e8c96a'],[98,128,28,43,'Тлеющий переход','#241311','#522a26','#d0705a'],[128,178,28,43,'Арена Ярости','#2c0c0c','#6a1f1c','#ff6a48'],
 [0,89,43,58,'Кристальные пещеры','#0c1f2e','#1f4766','#7ee0ff'],[89,178,43,58,'Затонувший город','#08191a','#1c3f3e','#5fc0a8'],
 [0,45,58,73,'Костяные поля','#1d1b17','#5c5646','#e8dfc0'],[45,90,58,73,'Забытая деревня','#161c28','#3c4660','#9aa8d8'],[90,134,58,73,'Медовые ульи','#2a1d05','#7a5410','#ffc840'],[134,178,58,73,'Старая библиотека','#1e1218','#573444','#d89ab0'],
 [0,45,73,88,'Ледяные залы','#0e2230','#3a6a86','#d0f4ff'],[45,90,73,88,'Водостоки','#0d1d14','#27503c','#6ad89a'],[90,134,73,88,'Старые кузницы','#241408','#5e3418','#ff9a40'],[134,178,73,88,'Пепельные пустоши','#1a1a1c','#4a4a50','#b8b8c0'],
 [0,60,88,103,'Корни мира','#17140a','#4a3c1c','#b8d060'],[60,120,88,103,'Тихие сады','#0a1c22','#1e4c58','#90f0e0'],[120,178,88,103,'Сердце глубин','#22080e','#5c1424','#ff7080'],
 [0,45,103,118,'Смоляные топи','#100f14','#2c2836','#8a80a8'],[45,90,103,118,'Соляные копи','#1c1a1e','#6a6068','#f4e8ec'],[90,134,103,118,'Обсерватория','#080c24','#202c60','#80a0ff'],[134,178,103,118,'Зал шестерён','#1c1608','#584820','#e0b850'],
 [0,45,118,133,'Лунное озеро','#081828','#1c3858','#a0d0ff'],[45,90,118,133,'Висячие корни','#101a08','#344c1c','#a8e060'],[90,134,118,133,'Стеклянный лес','#0a201e','#2a605a','#b0fff0'],[134,178,118,133,'Святилище идола','#201008','#60341c','#e8a070'],
 [0,45,133,148,'Зеркальные залы','#181824','#48486c','#d8d8ff'],[45,90,133,148,'Забытые гробницы','#141210','#3c342c','#b0a088'],[90,134,133,148,'Пустота','#050508','#1a1a28','#6060a0'],[134,178,133,148,'Край света','#18040c','#48102c','#ff60a0']
];
const areaAt=(c,r)=>AREAS.find(a=>c>=a[0]&&c<a[1]&&r>=a[2]&&r<a[3])||AREAS[4];

const BOSSES=[
 {name:'Гнилой Садовник',kind:'gardener',x:8,floor:24,w:56,h:60,hp:18,gate:28,min:2,max:28,side:-1,reward:'dash',text:'Получены рывок и магия «Искра». С разбега прыгните и сделайте рывок через большую пропасть на востоке перекрёстка.'},
 {name:'Каменный Крот',kind:'mole',x:168,floor:24,w:64,h:48,hp:22,gate:148,min:149,max:176,side:1,reward:'wall',text:'Получены крючья. У стены в воздухе жмите «Прыжок». Теперь колодец на перекрёстке ведёт наверх.'},
 {name:'Хозяин Ветров',kind:'kite',x:46,floor:9,w:60,h:46,hp:22,gate:64,min:40,max:64,side:-1,reward:'double',text:'Получен двойной прыжок. Перелезьте гладкую стену на востоке вершин.'},
 {name:'Погасший Колокол',kind:'bell',x:127,floor:9,w:72,h:88,hp:34,gate:110,min:111,max:134,side:1,final:true},
 {name:'Споровый Старейшина',kind:'shroom',x:8,floor:39,w:62,h:62,hp:24,gate:28,min:2,max:28,side:-1,text:'Старейшина побеждён. Он оставил много угольков.'},
 {name:'Хрустальный Часовой',kind:'crystal',x:8,floor:54,w:52,h:72,hp:30,gate:28,min:2,max:28,side:-1,text:'Часовой разбит. Он оставил много угольков.'},
 {name:'Костяной Пастух',kind:'bone',x:8,floor:69,w:50,h:68,hp:28,gate:28,min:2,max:28,side:-1,reward:'charge',text:'Получен сильный удар. Держите «Удар», пока вокруг не вспыхнет кольцо, и отпустите. Он ломает треснувшую стену в ульях.'},
 {name:'Живой Фолиант',kind:'tome',x:166,floor:69,w:60,h:50,hp:30,gate:148,min:149,max:176,side:1,reward:'slam',text:'Получен обвал. В прыжке жмите «Обвал» (или G). Он пробивает треснувший пол в кузницах.'},
 {name:'Инеевый Великан',kind:'frost',x:8,floor:84,w:68,h:78,hp:34,gate:28,min:2,max:28,side:-1,text:'Искра окрепла: теперь она бьёт сильнее и летит сквозь стены.'},
 {name:'Первый Уголь',kind:'ember',x:166,floor:99,w:66,h:70,hp:50,gate:148,min:149,max:176,side:1,text:'Первый Уголь погас. Но лестницы ведут ещё глубже.'},
 {name:'Смоляная Матрона',kind:'tar',x:8,floor:114,w:70,h:56,hp:44,gate:28,min:2,max:28,side:-1,dmg:2,text:'Смоляная Матрона: победа. Вы стали на шаг ближе к краю света.'},
 {name:'Шестерённый Судья',kind:'gear',x:166,floor:114,w:62,h:62,hp:48,gate:148,min:149,max:176,side:1,dmg:2,text:'Шестерённый Судья: победа. Вы стали на шаг ближе к краю света.'},

 for(const [id,x,y] of FINDS)if(!save.owned.includes(id)&&over(p,{x:x*T,y:y*T,w:T,h:T})){save.owned.push(id);store();say('Найден амулет «'+AMULETS[id].name+'». Наденьте его в меню.',240)}

 for(const e of foes){
  if(e.hit>0)e.hit--;

  if(e.hp>0&&e.hit<=0&&over(p,e))hurt(e.x+e.w/2);

 if(trial)updateTrial();

function updateBoss(p,reach,power,gain){
 const b=boss,d=b.d,k=d.kind,floor=d.floor*T,min=d.min*T,max=d.max*T-b.w;
 b.t++;if(b.hit>0)b.hit--;
 const rage=b.hp<b.max/2,desperate=b.hp<b.max/4,px=p.x+9,cx=b.x+b.w/2,hard=!save.easy;
 const aimShots=(n,spread,speed)=>{const a=Math.atan2(p.y+14-(b.y+b.h/2),px-cx);for(let i=0;i<n;i++){const q=a+(i-(n-1)/2)*spread;shots.push({x:cx-7,y:b.y+b.h/2-7,w:14,h:14,vx:Math.cos(q)*speed,vy:Math.sin(q)*speed,life:150})}};
 const go=m=>{b.mode=m;b.t=0;b.vx=0;b.n++};
 const flies=k==='kite'||k==='tome'||k==='ray';
 if(b.mode==='wait'){
  b.f=px<cx?-1:1;b.vx=0;
  if(flies){b.x+=Math.sign(px-cx)*1.6;b.y+=(floor-180-b.y)*.05}
  if(b.t>(hard?(desperate?14:rage?22:36):(rage?34:54))){
   const list={gardener:['charge','leap'],mole:['dig','throw','charge'],kite:['swoop','drop','swoop'],bell:['charge','leap','rain'],shroom:['leap','throw','rain'],crystal:['charge','rain','throw','leap'],bone:['charge','throw','leap'],tome:['drop','swoop','swoop'],frost:['rain','leap','throw'],ember:['charge','rain','leap','throw','charge'],tar:['leap','erupt','throw','leap'],gear:['charge','fan','charge','erupt'],ray:['swoop','drop','fan','swoop'],idol:['erupt','rain','fan','erupt'],duel:['blink','charge','leap','blink','fan'],void:['blink','erupt','fan','rain','charge','leap']}[k];
   // после половины здоровья боссы получают новые атаки
   const extra=hard&&rage&&!flies?[...list,'fan','erupt']:list;
   go(extra[(b.n+Math.floor(Math.random()*2))%extra.length]);
   if(b.mode==='leap'){b.vy=-11;b.vx=Math.max(-6,Math.min(6,(px-cx)/44))}
   if(b.mode==='swoop')b.tx=px-b.w/2;
   if(b.mode==='blink'){burst(cx,b.y+b.h/2,'#d8d8ff',24);const side=px+150<d.max*T?1:-1;b.x=Math.max(min,Math.min(max,px+side*130-b.w/2))}
  }
 }else if(b.mode==='charge'){
  if(b.t>(hard?24:30))b.vx=b.f*(hard?(rage?7.8:6.4):(rage?6.5:5));
  if(b.t>100)go('wait');
 }else if(b.mode==='blink'){
  b.f=px<cx?-1:1;if(b.t>22){b.mode='charge';b.t=24}
 }else if(b.mode==='fan'){
  if(b.t===24)aimShots(rage?5:3,.28,4.4);
  if(hard&&rage&&b.t===46)aimShots(4,.3,4.4);
  if(b.t>66)go('wait');
 }else if(b.mode==='erupt'){ // столбы из пола под героем, с предупреждением
  if(b.t%(desperate?20:28)===1&&b.t<(rage?86:60))hazards.push({x:p.x-12,y:floor-150,w:42,h:150,t:0});
  if(b.t>110)go('wait');
 }else if(b.mode==='rain'){
  if(b.t%(hard?(rage?8:11):(rage?11:16))===0&&b.t<80)shots.push({x:px+(Math.random()-.5)*170,y:floor-7*T+2,w:10,h:18,vx:0,vy:4});
  if(b.t>100)go('wait');
 }else if(b.mode==='throw'){
  if(b.t===22||b.t===40||(rage&&b.t===58)||(hard&&desperate&&b.t===72))shots.push({x:cx,y:b.y,w:16,h:16,vx:(px-cx)/52,vy:-7,g:.27});
  if(b.t>90)go('wait');
 }else if(b.mode==='dig'){
  if(b.t<55)b.x+=Math.max(-5,Math.min(5,px-cx));
  if(b.t===75){b.mode='leap';b.t=0;b.y=floor-b.h;b.vy=-10;b.vx=0;shake=14;burst(cx,floor,'#a07a58',30)}
 }else if(b.mode==='swoop'){
  if(b.t>18){b.x+=(b.tx-b.x)*.07;b.y+=(floor-b.h-4-b.y)*.1}
  if(b.t>(rage?95:120))go('wait');
 }else if(b.mode==='drop'){
  b.x+=Math.sin(b.t/20)*3;b.y+=(floor-190-b.y)*.05;
  if(b.t%(hard?(rage?16:24):(rage?20:30))===0){const dx=px-cx,dy=p.y+14-b.y,l=Math.hypot(dx,dy)||1;shots.push({x:cx,y:b.y+b.h,w:14,h:14,vx:dx/l*4,vy:dy/l*4})}

 let wall=false;
 if(!flies&&b.mode!=='dig'){b.vy=Math.min(b.vy+.5,11);wall=move(b)}

 if(b.mode==='leap'&&b.on&&b.t>5){go('wait');shake=14;for(const s of [-1,1]){shots.push({x:b.x+b.w/2,y:floor-18,w:18,h:16,vx:s*4.6,vy:0,life:65});if(hard&&rage)shots.push({x:b.x+b.w/2,y:floor-18,w:18,h:16,vx:s*2.6,vy:0,life:80})}}
 if(!(k==='mole'&&b.mode==='dig')){
  if(p.atk>0&&b.last!==p.swing&&over(reach,b)){b.last=p.swing;b.hp-=power;b.hit=8;gain();burst(p.f>0?b.x:b.x+b.w,p.y+10,'#ffc45c',10)}

 }
 if(b.hp<=0){
  burst(b.x+b.w/2,b.y+b.h/2,'#ffc45c',80);
  save.beaten[b.i]=true;if(d.reward)save.abil[d.reward]=true;
  drop(b.x+b.w/2,b.y,d.reward?60:140);
  for(let r=0;r<ROWS;r++)if(grid[r][d.gate]===4)grid[r][d.gate]=0;
  boss=null;shots=[];hazards=[];store();p.slam=false;
  if(d.final){state='win';release()}else{p.hp=maxHp();say(d.text,360)}
 }
}

  else if(e.type==='hop'){ell(x,y+1,12,12,c);poly(c,[[x-9,y-6],[x-13,y-18],[x-2,y-10]]);poly(c,[[x+9,y-6],[x+13,y-18],[x+2,y-10]]);g.fillStyle=c;g.fillRect(x-9,y+10,5,4);g.fillRect(x+4,y+10,5,4)}
  else{poly(c,[[x-15,y+15],[x-6,y-15],[x+6,y-15],[x+15,y+15]]);ell(x,y-10,7,5,e.t>80?'#a8f0ff':'#33202a')}
  ell(x-5,y,2.5,2.5,'#ff5a72');ell(x+5,y,2.5,2.5,'#ff5a72');
 }
 if(boss)drawBoss();
 for(const s of shots){const c=s.g?'#c8a074':'#a8f0ff';if(!s.g)glow(s.x+s.w/2,s.y+s.h/2,22,'rgba(168,240,255,.7)');ell(s.x+s.w/2,s.y+s.h/2,s.w/2,s.h/2,c)}
 for(const b of bolts){glow(b.x+b.w/2,b.y+b.h/2,b.w+8,'rgba(255,220,120,.8)');ell(b.x+b.w/2,b.y+b.h/2,b.w/2,b.h/2-1,'#fff4c0')}
 for(const c of casts){g.globalAlpha=c.t/22;if(c.kind==='pillar'){for(let i=0;i<4;i++)poly('#fff4c0',[[c.x+i*20,c.y+c.h],[c.x+i*20+9,c.y+(i%2)*26],[c.x+i*20+18,c.y+c.h]])}else{g.strokeStyle='#ff9a3a';g.lineWidth=10;g.beginPath();g.ellipse(c.x+c.w/2,c.y+c.h/2,c.w/2*(1-c.t/40),c.h/2*(1-c.t/40),0,0,7);g.stroke()}g.globalAlpha=1}
 for(const h of hazards){if(h.t<=38){g.fillStyle=frame%8<4?'rgba(255,90,70,.8)':'rgba(255,90,70,.35)';g.fillRect(h.x,h.y+h.h-5,h.w,5)}else poly('#ff7a50',[[h.x,h.y+h.h],[h.x+h.w*.3,h.y+20],[h.x+h.w/2,h.y],[h.x+h.w*.7,h.y+20],[h.x+h.w,h.y+h.h]])}
 for(const c of coins){ell(c.x+4,c.y+4,4.5,4.5,'#ff9a3a');ell(c.x+4,c.y+4,2,2,'#fff0b0')}
 for(const q of parts){g.globalAlpha=Math.min(1,q.t/20);g.fillStyle=q.col;g.fillRect(q.x-2,q.y-2,4,4)}
 g.globalAlpha=1;drawHero();g.restore();
 for(let i=0;i<maxHp();i++)ell(16+i%10*18,18+Math.floor(i/10)*17,7,7,i<P.hp?'#ffc45c':'rgba(255,255,255,.15)');
 const hy=maxHp()>10?17:0;
 if(save.healSeen||P.light)for(let i=0;i<9;i++){g.fillStyle=i<P.light?'#fff0c0':'rgba(255,255,255,.15)';g.fillRect(10+i*12+Math.floor(i/3)*4,30+hy,9,5)}
 if(save.rageSeen||P.rage||P.angry){g.fillStyle='rgba(255,255,255,.15)';g.fillRect(10,40+hy,116,6);g.fillStyle=P.angry>0||P.rage>=100?'#ff5238':'#a8483a';g.fillRect(10,40+hy,116*(P.angry>0?P.angry/(has('crown')?720:480):P.rage/100),6)}
 ell(15,57+hy,5,5,'#ff9a3a');text(String(save.coins),25,62+hy,13,'#ffd8a0','left');
 if(boss){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(VW*.15,40,VW*.7,0);g.fillRect(VW*.25,VH-14,VW*.5,7);g.fillStyle='#e0705a';g.fillRect(VW*.25,VH-14,VW*.5*Math.max(0,boss.hp)/boss.max,7);text(boss.d.name,VW/2,VH-19,13,'#fff0c0')}
 if(msgT>0&&state==='play')wrapText(msg,96,16,'#fff0c0');
 if(state!=='play'){
  g.fillStyle='rgba(5,9,11,.9)';g.fillRect(0,0,VW,VH);
  let y=86;
  if(state==='title'){
   y=wrapText('Фонарщик глубин',y,32,'#ffc45c')+8;
   y=wrapText('Тридцать пять мест, шестнадцать боссов, магия, амулеты, лавка и Арена Ярости. Новые кнопки появляются по ходу игры.',y,15,'#dce8e4')+18;
   if(save.started){y=wrapText('Нажмите на экран или пробел, чтобы продолжить',y,15,'#fff0c0');wrapText('Новая игра: кнопка «Удар» или J',y+4,14,'#8aa3a0')}
   else wrapText('Нажмите на экран или пробел, чтобы начать',y,15,'#fff0c0');
  }else if(state==='dead'){y=wrapText('Огонь погас',140,30,'#ff8a7a')+16;wrapText('Нажмите, чтобы вернуться к фонарю. Умения, амулеты и угольки останутся.',y,15,'#8aa3a0')}
  else{y=wrapText('Колокол снова звучит',120,28,'#ffc45c')+10;y=wrapText('Главный страж побеждён. Падений: '+save.deaths,y,17,'#dce8e4')+18;wrapText('Нажмите, чтобы исследовать мир дальше',y,15,'#8aa3a0')}
 }
 g.restore();
}
let last=0,acc=0;
function loop(t){
 acc+=Math.min(100,t-last);last=t;
 while(acc>=1000/60){if(paused){acc=0;break}update();acc-=1000/60}
 syncButtons();draw();requestAnimationFrame(loop);
}
save=readSave();applySize();spawn();requestAnimationFrame(loop);
</script>
